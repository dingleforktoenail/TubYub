<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MeTub</title>
<style>
:root{--bg:#0f0f10;--panel:#18181b;--panel2:#222225;--text:#f5f5f5;--muted:#a7a7ad;--line:#303036;--accent:#ff3158;--accent2:#ff5475;--good:#4ade80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Arial,Helvetica,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}
.top{height:64px;position:sticky;top:0;z-index:20;background:rgba(15,15,16,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:18px}
.logo{font-weight:900;font-size:25px;letter-spacing:-1px;color:white}.logo span{color:var(--accent)}
.search{display:flex;flex:1;max-width:700px;margin:auto;gap:0}.search input{width:100%;background:#18181b;border:1px solid #3a3a40;color:white;padding:11px 15px;border-radius:22px 0 0 22px;outline:none}.search button{background:#29292e;color:white;width:54px;border-radius:0 22px 22px 0}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#3a3a40}.userbtn{display:flex;align-items:center;gap:8px;color:white;background:none}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 64px)}.side{border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:64px;height:calc(100vh - 64px)}.nav{display:flex;align-items:center;gap:13px;padding:12px;border-radius:10px;color:#ddd;background:transparent;width:100%;text-align:left}.nav:hover,.nav.active{background:#252528}.nav .ico{width:22px;text-align:center;font-size:18px}.side hr{border:0;border-top:1px solid var(--line);margin:14px 8px}.main{padding:28px;max-width:1500px;width:100%;margin:auto}.chips{display:flex;gap:9px;overflow:auto;margin-bottom:24px}.chip{white-space:nowrap;background:#242428;color:#eee;padding:8px 14px;border-radius:18px}.chip.active{background:white;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:28px 18px}.card{cursor:pointer}.thumb{aspect-ratio:16/9;background:#202024;border-radius:12px;overflow:hidden;position:relative}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}.thumb .badge{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.82);padding:3px 6px;border-radius:4px;font-size:11px}.meta{display:flex;gap:10px;padding-top:10px}.mini{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#333}.title{font-weight:700;font-size:15px}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:15px}.btn{background:#29292d;color:#fff;border-radius:20px;padding:9px 16px}.btn.primary{background:var(--accent);font-weight:700}.btn.light{background:#fff;color:#111}.btn.danger{background:#8d1830}.iconbtn{background:#29292d;color:white;border-radius:20px;padding:9px 13px}.page-title{font-size:28px;margin:0 0 20px}.empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed #3a3a40;border-radius:16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{width:min(700px,100%);max-height:92vh;overflow:auto;background:#19191c;border:1px solid var(--line);border-radius:18px;padding:24px}.modal h2{margin-top:0}.field{margin:14px 0}.field label{display:block;color:#ddd;font-weight:700;margin-bottom:7px}.field input,.field textarea{width:100%;background:#101012;border:1px solid #3a3a40;color:#fff;border-radius:10px;padding:11px;outline:none}.field textarea{min-height:110px;resize:vertical}.close{float:right;background:#2a2a2e;color:#fff;width:32px;height:32px;border-radius:50%}
.playerwrap{max-width:1000px;margin:auto}.player{width:100%;max-height:70vh;background:#000;border-radius:12px}.video-page h1{font-size:23px;margin:18px 0 8px}.channelbar{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.actions{display:flex;gap:8px;margin-left:auto}.description{white-space:pre-wrap;background:#1c1c1f;border-radius:12px;padding:14px;margin:14px 0}.comments{max-width:850px;margin-top:25px}.comment{display:flex;gap:10px;margin:18px 0}.comment p{margin:3px 0}.commentbox{display:flex;gap:8px}.commentbox input{flex:1;background:#18181b;border:1px solid #3a3a40;color:#fff;border-radius:10px;padding:11px}
.profile-head{display:flex;gap:20px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line);margin-bottom:22px}.bigavatar{width:100px;height:100px;border-radius:50%;object-fit:cover;background:#333}.profile-head h1{margin:0;font-size:30px}.handle{color:var(--muted)}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:24px}.tab{padding:12px 4px;background:none;color:#aaa;border-bottom:2px solid transparent}.tab.active{color:#fff;border-color:var(--accent)}
.analytics{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.stat{background:#19191c;border:1px solid var(--line);border-radius:14px;padding:18px}.stat b{display:block;font-size:28px;margin-top:5px}.bar{height:12px;background:#29292d;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{width:min(430px,100%);background:#19191c;border:1px solid var(--line);border-radius:18px;padding:28px}.loginbox h1{font-size:36px;margin:0 0 6px}.loginbox .logo{margin-bottom:25px}.switch{color:#aaa}.link{color:#ff5475;cursor:pointer}
.upload-preview{display:flex;gap:12px;align-items:center;background:#111;padding:12px;border-radius:12px}.upload-preview video,.upload-preview img{width:150px;aspect-ratio:16/9;object-fit:cover;border-radius:8px}
.short-layout{max-width:500px;margin:auto}.short-card{margin-bottom:25px}.short-card .thumb{aspect-ratio:9/16}.short-card .thumb video{object-fit:cover}
.toast{position:fixed;right:20px;bottom:20px;background:#fff;color:#111;padding:12px 16px;border-radius:10px;z-index:100;box-shadow:0 8px 30px #0008}
@media(max-width:800px){.layout{grid-template-columns:1fr}.side{position:fixed;bottom:0;top:auto;width:100%;height:62px;z-index:30;background:#151518;border-right:0;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:5px}.side hr,.side .label{display:none}.nav{width:auto;flex-direction:column;gap:1px;padding:5px;font-size:10px}.main{padding:18px 12px 85px}.top{padding:0 10px}.search{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 10px}.mini{width:32px;height:32px}.title{font-size:13px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal" class="modal"></div>
<script>
const DB_NAME='metub_db_v1', STORE='app';
let db, state={page:'home',user:null,search:'',selected:null,feed:'all',profileTab:'videos'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random();
const fmt=n=>Intl.NumberFormat().format(n||0);
const ago=ts=>{let s=Math.floor((Date.now()-ts)/1000);if(s<60)return s+'s ago';let m=Math.floor(s/60);if(m<60)return m+'m ago';let h=Math.floor(m/60);if(h<24)return h+'h ago';let d=Math.floor(h/24);if(d<30)return d+'d ago';return Math.floor(d/30)+'mo ago'};
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function get(k){return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(k,v){return new Promise((res,rej)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).put(v,k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function del(k){return new Promise((res,rej)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function allVideos(){return (await get('videos'))||[]}
async function saveVideos(v){await put('videos',v)}
async function users(){return (await get('users'))||[]}
async function saveUsers(u){await put('users',u)}
function avatar(u){return u?.avatar||'data:image/svg+xml;charset=utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#333"/><text x="50" y="58" font-size="45" text-anchor="middle" fill="white">${esc((u?.name||'M')[0].toUpperCase())}</text></svg>`)}

async function init(){
 await openDB();
 state.user=await get('session');
 let us=await users(), vs=await allVideos();
 if(!us.length){
   us=[{id:uid(),email:'demo@metub.local',password:'demo123',name:'Demo Creator',handle:'@demo_creator',avatar:null,subs:0,created:Date.now()}];
   await saveUsers(us);
 }
 if(!vs.length){
   // Starter cards use generated poster images; no external assets.
   const sample=[];
   for(let i=1;i<=4;i++) sample.push({id:uid(),owner:us[0].id,title:['Welcome to MeTub','How MeTub Works','Creator Tips','Explore the Feed'][i-1],description:'A sample MeTub video. Upload your own video to replace this demo content.',video:null,thumb:'',created:Date.now()-i*86400000,views:0,likes:[],comments:[],short:false});
   await saveVideos(sample);
 }
 render();
}
function nav(){
 if(!state.user)return `<div class="login"><div class="loginbox"><div class="logo">Me<span>Tub</span></div><h1>Welcome back</h1><p class="muted">Sign in to access your channel, upload videos, comment, like, and subscribe.</p><div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="Password"></div><button class="btn primary" style="width:100%" onclick="login()">Sign in</button><p class="switch">New here? <span class="link" onclick="showSignup()">Create an account</span></p><p class="small muted">Demo account: demo@metub.local / demo123</p></div></div>`;
 return `<div class="top"><div class="logo" onclick="go('home')">Me<span>Tub</span></div><div class="search"><input value="${esc(state.search)}" placeholder="Search MeTub" onkeydown="if(event.key==='Enter'){state.search=this.value;go('search')}"><button onclick="state.search=document.querySelector('.search input').value;go('search')">⌕</button></div><button class="btn primary" onclick="openUpload()">＋ Create</button><button class="userbtn" onclick="go('channel')"><img class="avatar" src="${avatar(state.user)}"><span class="label">${esc(state.user.name)}</span></button></div>
 <div class="layout"><aside class="side">
  <button class="nav ${state.page==='home'?'active':''}" onclick="go('home')"><span class="ico">⌂</span><span class="label">Home</span></button>
  <button class="nav ${state.page==='shorts'?'active':''}" onclick="go('shorts')"><span class="ico">▶</span><span class="label">Shorts</span></button>
  <button class="nav ${state.page==='subscriptions'?'active':''}" onclick="go('subscriptions')"><span class="ico">▣</span><span class="label">Subscriptions</span></button>
  <hr>
  <button class="nav ${state.page==='channel'?'active':''}" onclick="go('channel')"><span class="ico">◉</span><span class="label">Your channel</span></button>
  <button class="nav ${state.page==='analytics'?'active':''}" onclick="go('analytics')"><span class="ico">⌁</span><span class="label">Analytics</span></button>
  <button class="nav" onclick="editChannel()"><span class="ico">⚙</span><span class="label">Channel settings</span></button>
  <button class="nav" onclick="logout()"><span class="ico">⇥</span><span class="label">Sign out</span></button>
 </aside><main class="main" id="main"></main></div>`;
}
async function render(){
 $('#root').innerHTML=nav();
 if(!state.user)return;
 if(state.page==='home')return home();
 if(state.page==='shorts')return shorts();
 if(state.page==='subscriptions')return subscriptions();
 if(state.page==='channel')return channel(state.user.id);
 if(state.page==='analytics')return analytics();
 if(state.page==='video')return videoPage(state.selected);
 if(state.page==='search')return searchPage();
}
function go(p){state.page=p;state.selected=null;render()}
async function home(){
 let vs=(await allVideos()).filter(v=>!v.short);vs=vs.sort(()=>Math.random()-.5);
 $('#main').innerHTML=`<div class="chips"><button class="chip active">All</button><button class="chip" onclick="state.feed='gaming';home()">Gaming</button><button class="chip" onclick="state.feed='music';home()">Music</button><button class="chip" onclick="state.feed='learning';home()">Learning</button><button class="chip" onclick="state.feed='creator';home()">Creators</button></div><h1 class="page-title">For You</h1>${cards(vs)}`;
}
async function shorts(){
 let vs=(await allVideos()).filter(v=>v.short);
 $('#main').innerHTML=`<h1 class="page-title">Shorts</h1><div class="short-layout">${vs.length?vs.map(v=>shortCard(v)).join(''):'<div class="empty">No Shorts yet. Upload a portrait video to create one automatically.</div>'}</div>`;
}
async function subscriptions(){
 let vs=await allVideos();let ids=state.user.following||[];vs=vs.filter(v=>ids.includes(v.owner));
 $('#main').innerHTML=`<h1 class="page-title">Subscriptions</h1>${vs.length?cards(vs):'<div class="empty">Channels you subscribe to will appear here.</div>'}`;
}
async function searchPage(){
 let q=state.search.toLowerCase(),vs=(await allVideos()).filter(v=>v.title.toLowerCase().includes(q)||v.description.toLowerCase().includes(q));
 $('#main').innerHTML=`<h1 class="page-title">Search results for “${esc(state.search)}”</h1>${cards(vs)}`;
}
async function owner(id){return (await users()).find(u=>u.id===id)}
async function cards(vs){
 if(!vs.length)return '<div class="empty">No videos found.</div>';
 let us=await users();return `<div class="grid">${vs.map(v=>{let u=us.find(x=>x.id===v.owner)||us[0];return `<article class="card" onclick="openVideo('${v.id}')"><div class="thumb">${v.video?`<video src="${v.video}" muted preload="metadata"></video>`:`<div style="height:100%;display:grid;place-items:center;font-size:55px;background:linear-gradient(135deg,#25252a,#151518)">▶</div>`}<span class="badge">${v.short?'SHORT':''}</span></div><div class="meta"><img class="mini" src="${avatar(u)}"><div><div class="title">${esc(v.title)}</div><div class="muted">${esc(u.name)}</div><div class="muted small">${fmt(v.views)} views · ${ago(v.created)}</div></div></div></article>`}).join('')}</div>`;
}
function shortCard(v){return `<article class="short-card card" onclick="openVideo('${v.id}')"><div class="thumb">${v.video?`<video src="${v.video}" controls playsinline></video>`:'<div style="height:100%;display:grid;place-items:center">▶</div>'}</div><div class="meta"><div><div class="title">${esc(v.title)}</div><div class="muted">${fmt(v.views)} views</div></div></div></article>`}
async function openVideo(id){state.selected=id;state.page='video';let vs=await allVideos(),v=vs.find(x=>x.id===id);if(v){v.views=(v.views||0)+1;await saveVideos(vs)}render()}
async function videoPage(id){
 let v=(await allVideos()).find(x=>x.id===id),u=await owner(v.owner);if(!v)return;
 let liked=(v.likes||[]).includes(state.user.id), following=(state.user.following||[]).includes(u.id);
 $('#main').innerHTML=`<div class="playerwrap video-page"><button class="btn" onclick="go('home')">← Back</button><div style="margin-top:15px">${v.video?`<video class="player" src="${v.video}" controls playsinline></video>`:'<div class="player" style="aspect-ratio:16/9;display:grid;place-items:center;font-size:70px">▶</div>'}</div><h1>${esc(v.title)}</h1><div class="muted">${fmt(v.views)} views · ${new Date(v.created).toLocaleDateString()}</div><div class="channelbar"><img class="mini" src="${avatar(u)}"><div><b>${esc(u.name)}</b><div class="muted">${esc(u.handle)}</div></div>${u.id!==state.user.id?`<button class="btn ${following?'':'primary'}" onclick="toggleFollow('${u.id}')">${following?'Subscribed':'Subscribe'}</button>`:''}<div class="actions"><button class="iconbtn" onclick="toggleLike('${v.id}')">♡ ${fmt((v.likes||[]).length)}${liked?' · Liked':''}</button><button class="iconbtn" onclick="navigator.clipboard?.writeText(location.href);toast('Link copied')">Share</button></div></div><div class="description">${esc(v.description||'No description.')}</div><div class="comments"><h2>Comments (${v.comments?.length||0})</h2><div class="commentbox"><input id="comment" placeholder="Add a comment..."><button class="btn primary" onclick="comment('${v.id}')">Comment</button></div>${(v.comments||[]).map(c=>`<div class="comment"><img class="mini" src="${avatar(c.user)}"><div><b>${esc(c.user.name)}</b><div class="muted small">${ago(c.created)}</div><p>${esc(c.text)}</p></div></div>`).join('')}</div></div>`;
}
async function toggleLike(id){let vs=await allVideos(),v=vs.find(x=>x.id===id),a=v.likes||[],i=a.indexOf(state.user.id);i>=0?a.splice(i,1):a.push(state.user.id);await saveVideos(vs);render()}
async function toggleFollow(id){let us=await users(),u=us.find(x=>x.id===id),me=us.find(x=>x.id===state.user.id);me.following=me.following||[];let i=me.following.indexOf(id);if(i>=0){me.following.splice(i,1);u.subs=Math.max(0,(u.subs||0)-1)}else{me.following.push(id);u.subs=(u.subs||0)+1}await saveUsers(us);state.user=me;await put('session',me);render()}
async function comment(id){let input=$('#comment'),t=input?.value.trim();if(!t)return;let vs=await allVideos(),v=vs.find(x=>x.id===id);v.comments=v.comments||[];v.comments.unshift({id:uid(),text:t,created:Date.now(),user:{id:state.user.id,name:state.user.name,avatar:state.user.avatar}});await saveVideos(vs);render()}
async function channel(id){
 let u=await owner(id),vs=(await allVideos()).filter(v=>v.owner===id).sort((a,b)=>b.created-a.created),own=id===state.user.id;
 $('#main').innerHTML=`<div class="profile-head"><img class="bigavatar" src="${avatar(u)}"><div><h1>${esc(u.name)}</h1><div class="handle">${esc(u.handle)} · ${fmt(u.subs||0)} subscribers</div><div class="muted">${vs.length} videos</div></div><div style="margin-left:auto">${own?'<button class="btn" onclick="editChannel()">Customize channel</button>':`<button class="btn ${((state.user.following||[]).includes(id))?'':'primary'}" onclick="toggleFollow('${id}')">${((state.user.following||[]).includes(id))?'Subscribed':'Subscribe'}</button>`}</div></div><div class="tabs"><button class="tab active">Videos</button>${own?'<button class="tab" onclick="go(\\'analytics\\')">Analytics</button>':''}</div>${cards(vs)}`;
}
async function analytics(){
 let vs=(await allVideos()).filter(v=>v.owner===state.user.id),views=vs.reduce((a,v)=>a+(v.views||0),0),likes=vs.reduce((a,v)=>a+(v.likes?.length||0),0),comments=vs.reduce((a,v)=>a+(v.comments?.length||0),0);
 $('#main').innerHTML=`<div class="between"><div><h1 class="page-title">Channel Analytics</h1><div class="muted">Only your channel data is shown here.</div></div><button class="btn" onclick="go('channel')">View channel</button></div><div class="analytics"><div class="stat">Views<b>${fmt(views)}</b><span class="muted">All your videos</span></div><div class="stat">Likes<b>${fmt(likes)}</b><span class="muted">Across your videos</span></div><div class="stat">Comments<b>${fmt(comments)}</b><span class="muted">Across your videos</span></div><div class="stat">Subscribers<b>${fmt(state.user.subs||0)}</b><span class="muted">Current subscribers</span></div></div><h2 style="margin-top:30px">Your videos</h2><div>${vs.length?vs.map(v=>`<div class="stat" style="margin:10px 0"><div class="between"><b>${esc(v.title)}</b><span>${fmt(v.views)} views</span></div><div class="bar" style="margin-top:10px"><i style="width:${Math.min(100,Math.max(4,(v.views||0)/(Math.max(1,views))*100))}%"></i></div></div>`).join(''):'<div class="empty">Upload a video to start seeing analytics.</div>'}</div>`;
}
function openUpload(){
 if(!state.user)return;
 $('#modal').className='modal show';$('#modal').innerHTML=`<div class="modalbox"><button class="close" onclick="closeModal()">×</button><h2>Create a video</h2><p class="muted">Upload an MP4 or another browser-supported video file. MeTub detects portrait videos and publishes them as Shorts.</p><div class="field"><label>Video file</label><input id="vfile" type="file" accept="video/*" onchange="previewUpload()"></div><div id="upPreview"></div><div class="field"><label>Title</label><input id="vtitle" maxlength="120" placeholder="Give your video a title"></div><div class="field"><label>Description</label><textarea id="vdesc" maxlength="5000" placeholder="Tell viewers about your video"></textarea></div><div class="field"><label>Thumbnail</label><input id="thumbfile" type="file" accept="image/*" onchange="previewThumb()"><div id="thumbPreview"></div></div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="publishVideo()">Publish</button></div></div>`;
}
function previewUpload(){let f=$('#vfile').files[0];if(!f)return;let url=URL.createObjectURL(f),v=document.createElement('video');v.src=url;v.onloadedmetadata=()=>{$('#upPreview').innerHTML=`<div class="upload-preview"><video src="${url}" muted controls></video><div><b>${esc(f.name)}</b><div class="muted">${v.videoWidth} × ${v.videoHeight} · ${v.videoWidth/v.videoHeight<1?'Short':'Video'}</div></div></div>`}}
function previewThumb(){let f=$('#thumbfile').files[0];if(f)$('#thumbPreview').innerHTML=`<img style="width:150px;border-radius:8px;margin-top:8px" src="${URL.createObjectURL(f)}">`}
async function publishVideo(){
 let f=$('#vfile').files[0];if(!f){toast('Choose a video first');return}
 let video=document.createElement('video'),url=URL.createObjectURL(f);video.src=url;
 await new Promise(r=>video.onloadedmetadata=r);
 let thumbFile=$('#thumbfile').files[0],thumb=thumbFile?await readData(thumbFile):'';
 let blob=await f.arrayBuffer();
 let rec={id:uid(),owner:state.user.id,title:$('#vtitle').value.trim()||f.name.replace(/\.[^.]+$/,''),description:$('#vdesc').value.trim(),video:new Blob([blob],{type:f.type}),thumb,created:Date.now(),views:0,likes:[],comments:[],short:(video.videoWidth/video.videoHeight)<1};
 let vs=await allVideos();vs.push(rec);await saveVideos(vs);closeModal();toast(rec.short?'Published as a Short!':'Video published!');state.page=rec.short?'shorts':'channel';render();
}
function readData(file){return new Promise((res,rej)=>{let r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function editChannel(){
 let u=state.user;$('#modal').className='modal show';$('#modal').innerHTML=`<div class="modalbox"><button class="close" onclick="closeModal()">×</button><h2>Customize your channel</h2><div class="field"><label>Channel name</label><input id="cname" maxlength="60" value="${esc(u.name)}"></div><div class="field"><label>Handle</label><input id="chandle" maxlength="30" value="${esc(u.handle)}"></div><div class="field"><label>Profile picture</label><input id="cavatar" type="file" accept="image/*"></div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveChannel()">Save changes</button></div></div>`;
}
async function saveChannel(){
 let us=await users(),u=us.find(x=>x.id===state.user.id);u.name=$('#cname').value.trim()||u.name;let h=$('#chandle').value.trim();if(h&&!h.startsWith('@'))h='@'+h;u.handle=h||u.handle;let f=$('#cavatar').files[0];if(f)u.avatar=await readData(f);await saveUsers(us);state.user=u;await put('session',u);closeModal();render();toast('Channel updated')}
function closeModal(){$('#modal').className='modal'}
function toast(s){let d=document.createElement('div');d.className='toast';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
async function login(){let e=$('#email').value.trim().toLowerCase(),p=$('#password').value,us=await users(),u=us.find(x=>x.email===e&&x.password===p);if(!u){toast('Incorrect email or password');return}state.user=u;await put('session',u);render()}
function showSignup(){
 $('#root').innerHTML=`<div class="login"><div class="loginbox"><div class="logo">Me<span>Tub</span></div><h1>Create account</h1><div class="field"><label>Channel name</label><input id="sn" placeholder="Your name"></div><div class="field"><label>Handle</label><input id="sh" placeholder="@yourhandle"></div><div class="field"><label>Email</label><input id="se" type="email"></div><div class="field"><label>Password</label><input id="sp" type="password"></div><button class="btn primary" style="width:100%" onclick="signup()">Create account</button><p class="switch">Already have an account? <span class="link" onclick="render()">Sign in</span></p></div></div>`;
}
async function signup(){
 let us=await users(),e=$('#se').value.trim().toLowerCase(),p=$('#sp').value,n=$('#sn').value.trim(),h=$('#sh').value.trim();if(!e||!p||!n){toast('Fill in all required fields');return}if(us.some(x=>x.email===e)){toast('That email is already registered');return}if(!h.startsWith('@'))h='@'+h;let u={id:uid(),email:e,password:p,name:n,handle:h,avatar:null,subs:0,following:[],created:Date.now()};us.push(u);await saveUsers(us);state.user=u;await put('session',u);state.page='home';render()}
async function logout(){state.user=null;await del('session');render()}
init();
</script>
</body>
</html>
